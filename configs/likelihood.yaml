likelihood:
  enabled: true
  weight_mode: eb_beta_binomial
  weight_min: 1.0e-06
  ridge_lambda: 0.001
  objective_trace: false
  constraints:
    enforce_nonnegativity: true
    enforce_sum_to_one: true
  solver_order:
  - slsqp
  - pgd
  pgd:
    max_iters: 500
    tol: 1.0e-07
    step_size_init: 1.0
    backtracking_alpha: 0.5
    backtracking_beta: 0.5
    simplex_projection: standard
    history: false
  slsqp:
    max_iters: 500
    ftol: 1.0e-09
    eps: 1.0e-08
  composition_checks:
    clr:
      enable: false
      pseudocount: 1.0e-06
    alr:
      enable: false
      reference: unknown
      pseudocount: 1.0e-06
