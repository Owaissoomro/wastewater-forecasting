detection:
  enabled: true
  e_values:
    min_prop: 0.02
    tail: greater
    clip_p_min: 1.0e-06
    mean_target_max: 1000.0
    smoothing_window: 1
    calibrate: false
    combine_method: product
    truncation: 1000000.0
    allowed_inflation: 1.05
  multiple_testing:
    method: BH
    alpha: 0.1
    dependency: arbitrary
  shiryaev_roberts:
    enable: false
