schema_version: "1.0"

run:
  run_id: variant_deconvolution
  description: "pipeline"
  seed: 12345
  deterministic: true
  threads: 1
  float_dtype: float64
  site_ids: []
  lineage_filter: []
  fail_on_warning: false

io:
  data_dir: data
  results_dir: results
  jahn_like_path: data/jahn_like.csv
  signatures_path: data/signatures.csv
  lineages_path: data/lineages.csv
  write_parquet: true
  image_formats: [pdf, png]
  float_precision: 6
  use_symlink_if_possible: true

data:
  jahn_like: "data/jahn_like.csv"
  signatures: "data/signatures.csv"
  lineages: "data/lineages.csv"

plotting:
  dpi: 150
  figsize: [7.6, 4.4]
  legend_ncol: 3
  legend_fontsize: 10.0
  title_fontsize: 12.0
  tick_fontsize: 9.5
  date_format: "%Y-%m-%d"
  grid: true
  colors: []

logging:
  level: INFO
  jsonl: true
  flush_seconds: 0.0
  filename_prefix: logs

# ---------------------------
# Preprocessing 
# ---------------------------
preprocessing:
  seed: 12345
  min_coverage: 60
  left_censor_af: 0.010
  min_alt_count: 2
  bias_dropout_quantile: 0.10
  bias_min_highcov_quantile: 0.70
  bias_af_pos_rate_max: 0.010
  ridgeline_sites_max: 18
  heatmap_mutations_max: 220


# ---------------------------
preprocessing:
  seed: 12345

  # Keep-all hygiene (don’t drop rows; priors stage will handle coverage hygiene)
  min_coverage: 1
  left_censor_af: 0.01
  min_alt_count: 1

  # Optional bias summaries (won’t drop rows)
  bias_dropout_quantile: 0.10
  bias_min_highcov_quantile: 0.70
  bias_af_pos_rate_max: 0.01

  # Plot sizing (doesn’t affect priors)
  ridgeline_sites_max: 15
  heatmap_mutations_max: 200

priors:
  results_root: results
  data_root: data
  cap_coverage_quantile: 0.99

  # smoothing strength for day-wise logit(μ_t); higher => smoother trend
  rw2_penalty: 10.0

  # κ search bounds (global per mutation)
  kappa_lo: 0.05
  kappa_hi: 100.0

  min_dates: 2

# ---------------------------
likelihood:
  seed: 12345

  # ---------- Inputs ----------
  priors_hyperparams_path: results/priors/priors_hyperparams.csv
  priors_time_path:        results/priors/detail_global_timeseries.csv
  signatures_path:         data/signatures.csv
  snv_counts_path:         results/preprocessing/tables/feature_store_snv.csv

  # ---------- Mode ----------
  prior_only: false
  prior_only_fill_from_counts: true

  # ---------- Penalties ----------
  lambda_ridge: 0.0005
  temporal_smooth_lambda_l2: 0.02
  overlap_penalty_lambda: 0.0
  unknown_extra: 0.0

  # ---------- Numerics ----------
  robust_c: 4.685
  prior_jitter_beta0: 0.5
  prob_clip_eps: 0.00000001

  # ---------- Solver (IRLS + ADMM) ----------
  irls_max_iter: 10
  admm_max_iter: 500
  admm_tol: 0.0000005
  admm_rho: 1.0
  admm_adaptive_rho: true
  admm_rho_floor: 0.000001
  admm_rho_ceil: 1000000.0

  # ---------- Behavior ----------
  aggregate_by_date: true
  compute_uncertainty: true
  compute_leverage: true

  # ---------- Coverage hygiene ----------
  min_coverage_for_wls: 0.0
  cap_coverage_quantile: 0.999

  # ---------- Prior scaling ----------
  prior_kappa_scale: 1.0
  prior_kappa_cap: .inf
  temporal_cov_scale: 10000.0
