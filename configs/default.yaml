schema_version: "1.0"

run:
  run_id: wf-ssm
  description: "Wright–Fisher wastewater deconvolution pipeline"
  seed: 12345
  deterministic: true
  threads: 1
  float_dtype: float64
  site_ids: []
  lineage_filter: []
  fail_on_warning: false

io:
  data_dir: data
  results_dir: results
  jahn_like_path: data/jahn_like.csv
  signatures_path: data/signatures.csv
  lineages_path: data/lineages.csv
  write_parquet: true
  image_formats: [pdf, png]
  float_precision: 6
  use_symlink_if_possible: true

data:
  jahn_like: "data/jahn_like.csv"
  signatures: "data/signatures.csv"
  lineages: "data/lineages.csv"

plotting:
  dpi: 150
  figsize: [7.6, 4.4]
  legend_ncol: 3
  legend_fontsize: 10.0
  title_fontsize: 12.0
  tick_fontsize: 9.5
  date_format: "%Y-%m-%d"
  grid: true
  colors: []

logging:
  level: INFO
  jsonl: true
  flush_seconds: 0.0
  filename_prefix: logs

# ---------------------------
# Preprocessing (robust, low false positives)
# ---------------------------
preprocessing:
  seed: 12345
  min_coverage: 60
  left_censor_af: 0.010
  min_alt_count: 2
  bias_dropout_quantile: 0.10
  bias_min_highcov_quantile: 0.70
  bias_af_pos_rate_max: 0.010
  ridgeline_sites_max: 18
  heatmap_mutations_max: 220

# ---------------------------
# Priors (Beta–Binomial EB–MAP)
# ---------------------------
# ====================================================================
# configs/default.yaml  —  Globe-perfect setup (Preprocessing + Priors)
# ====================================================================

# ---------------------------
# Preprocessing (keep-all, light QC; writes feature_store_snv.csv)
# ---------------------------
preprocessing:
  seed: 12345

  # Keep-all hygiene (don’t drop rows; priors stage will handle coverage hygiene)
  min_coverage: 1
  left_censor_af: 0.01
  min_alt_count: 1

  # Optional bias summaries (won’t drop rows)
  bias_dropout_quantile: 0.10
  bias_min_highcov_quantile: 0.70
  bias_af_pos_rate_max: 0.01

  # Plot sizing (doesn’t affect priors)
  ridgeline_sites_max: 15
  heatmap_mutations_max: 200

# ---------------------------
# Priors — multi-site fusion + δ alignment + exact BB (perfect-fit)
# ---------------------------
priors:
  # I/O & numerics
  data_root: data
  results_root: results
  seed: 123
  eps: 1.0e-9
  max_iter_mle: 1000
  tol_mle: 1.0e-8
  eb_min_tau: 1.0e-4

  # Hygiene (stable pseudo-observations)
  min_coverage_for_update: 25      # ignore tiny-n in IEKS updates
  cap_coverage_quantile:  0.99     # cap giants so no single day dominates

  # Smoother stiffness (baseline)
  q_a_init: 0.0015                 # RW2 on a=logit(μ): smooth but responsive
  q_b_init: 0.00015                # RW1 on b=log(κ): light drift; avoids spikes
  laplace_iek_iters: 5
  q_iters: 2

  # Per-mutation tuning grid (narrow, realistic)
  tune_qLL_grid: [5e-4, 8e-4, 1e-3, 2e-3, 3e-3]
  tune_qb_grid:  [5e-5, 8e-5, 1e-4, 2e-4, 3e-4]
  tune_q_max_series: 12            # use more sites when available (robust tuning)

  # Site alignment (δ search)
  max_shift_days: 21               # bound shift to keep global alignment sane

  # κ calibration (hit 80% predictive coverage)
  calibrate_kappa_to: 0.80
  calibration_iters: 10
  kappa_scale_min: 0.50
  kappa_scale_max: 2.00
  kappa_global_cap_lo: 0.05
  kappa_global_cap_hi: 20.0
  calibration_max_rows: 200000

  # Wastewater fusion weights (set if you have these columns; else leave null)
  served_population_column: null   # e.g., served_population
  flow_column:              null   # e.g., flow_mgd
  qc_pass_column:           null   # e.g., qc_pass (0/1)

  # Gates (sanity)
  gates:
    coverage_tol: 0.02
    pit_ks_p_min: 0.10
    z_var_low: 0.95
    z_var_high: 1.05
    delta_ll_q50_min: 0.0

  # Exhaustive outputs (detail CSVs for every step; per-mutation splits)
  save_detail: true

# ---------------------------
# Likelihood (convex MAP on counts with Beta pseudo-counts)
# ---------------------------
likelihood:
  # Repro
  seed: 12345

  # --- explicit inputs (NO fallbacks) ---
  snv_counts_path: results/preprocessing/tables/feature_store_snv.csv   # or data/jahn_like.csv
  priors_hyperparams_path: results/priors/tables/priors_hyperparams.csv
  signatures_path: data/signatures.csv
  priors_time_path: results/priors/tables/priors_time_local.csv         # optional

  # (kept for interface; not used by MAP math)
  var_floor: 1.0e-6

  # Ridge on θ (slightly relaxed so estimates can move)
  lambda_ridge: 3.0e-4
  lambdas_grid: [1.0e-6, 3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]

  # Temporal L2 — make trends “hug” the data (coverage-aware below)
  temporal_smooth_lambda_l2: 0.003
  temporal_cov_scale: 1.5e4    # λ_t = base / sqrt(1 + cov/scale); less smoothing at high coverage

  # (TV retained for UI parity; unused in MAP)
  temporal_tv_lambda: 0.0
  tv_irls_rounds: 0
  auto_tune_temporal: false
  tune_grid_l2: [0.003, 0.005, 0.01]
  tune_grid_tv: [0.0]

  # Prior coupling knob (handled via Beta pseudo-counts already)
  mu_t_lambda: 0.0

  # Signature overlap & GLOBAL handling
  overlap_penalty_lambda: 0.0
  add_unknown_bucket: true
  unknown_floor: 0.0
  # note: unknown_extra_* is ignored unless your code passes it into the objective

  # Solver (mirror descent)
  pdhg_max_iter: 4000
  pdhg_tol: 5.0e-7
  prob_clip_eps: 1.0e-8

  # Behavior
  aggregate_by_date: true     # per site×date aggregation → stable, less noisy estimates

  # Plots & diagnostics (trim to avoid OOM)
  top_k_lineages_plot: 6
  site_timeseries_max: 6
  downsample_scatter: 80000
  merge_overlap_threshold: 0.90
  normalize_row_max_to_one: false

# ---------------------------
# Forecast (Wright–Fisher PF + MAP smoothing)
# ---------------------------
forecast:
  inputs:
    snv_counts_path: "results/preprocessing/tables/feature_store_snv.csv"
    signatures_path: "data/signatures.csv"
    priors_hyperparams_path: "results/priors/tables/priors_hyperparams.csv"
    baseline_theta_path: null

  wf:
    dirichlet_kappa: 300.0
    selection:
      enabled: false
      prior_mean: 0.0
      prior_sd: 0.05
      clip: [-0.9, 3.0]
    jitter_floor: 1.0e-8

  pf:
    num_particles: 1024
    resample_criterion: ness
    ness_threshold: 0.50
    resampling:
      method: systematic
    loglik_stabilization_eps: 1.0e-12
    seed: 12345

  smoothing:
    enabled: true
    lambda_kl: 8.0
    step_size: 0.03
    max_iter: 300
    tol: 1.0e-6

  posterior_predictive:
    pit_bins: 20
    num_draws: 400
  tplus1:
    use_last_coverage: true

  filter:
    sites: []
    lineages: []

# ---------------------------
# Detection (anytime-valid e-values, e-BH FDR, SR thresholding)
# ---------------------------
detection:
  seed: 12345
  alpha: 0.10
  min_prop: 0.015
  ci_confidence: 0.90
  beta_var_floor: 1.0e-5
  e_value_method: "power"
  e_value_power: 0.50
  p_floor: 1.0e-3
  sr_block_size: 7
  sr_alpha: 0.10
  sr_nperm: 500
  ebh_alpha: 0.10
  focus_site: null

# ---------------------------
# Diagnostics (analytic Beta–Binomial PPC/PIT)
# ---------------------------
diagnostics:
  seed: 12345
  n_ppc_draws: 400
  pit_bins: 20
  coverage_levels: [0.5, 0.8, 0.95]
  kappa_default: 200.0
  max_obs: null
  q_grid_points: 21
  chunk_rows: 3000
  sample_pit_per_site: 5000
  write_pred_obs_sample: true
  pred_obs_sample_per_site: 300

# ---------------------------
# Benchmarks (kept for parity; your default stage is the MAP solver)
# ---------------------------
benchmarks:
  seed: 12345
  methods: ["PGD", "GLM", "NMF"]
  lambda_reg: 1.0e-3
  tol: 1.0e-6
  max_iter: 500
  irls_lambda: 1.0e-3
  irls_max_iter: 120
  nmf_lambda: 1.0e-3
  nmf_max_iter: 220
  weight_mode: "priors"
  default_kappa: 120.0
  freyja_l1: 1.0e-3
  freyja_l2: 1.0e-3
  freyja_max_iter: 500
  freyja_tol: 1.0e-6
  vaquero_max_k: 15
  vaquero_ridge: 1.0e-3
  vaquero_tol: 1.0e-6
  fairness:
    coverage_quantiles: [0.25, 0.50, 0.75]
    overlap_quantiles: [0.33, 0.66]
    site_size_bins: [10, 30]

# ---------------------------
# Validation (holdouts & reliability)
# ---------------------------
validation:
  sensitivity:
    param_perturbation_pct: 0.20
    num_grid: 9
    seeds: [1001, 1002, 1003]
  jackknife:
    leave_one_site_out: true
  cv:
    time_folds: 3
    site_folds: 3
    shuffle: false
  external:
    enabled: false
    overlay_path: null
  reproducibility:
    seeds: [1, 2, 3, 4, 5]
